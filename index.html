            <defs>
              <filter id="lightningGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1"/>
                <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
                <feMerge>
                  <feMergeNode in="blur2"/>
                  <feMergeNode in="blur1"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            <path class="lightning-bolt-path" d="M95,0 L70,85 L102,90 L52,185 L84,190 L20,310 L44,240 L34,380" stroke="#f0f9ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#lightningGlow)"/>
